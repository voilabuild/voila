[project]
name = "voila-e2e"
version = "0"
description = "End-to-end tests for the voila binary"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pytest>=8.3",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pyright>=1.1.390"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"

[tool.pyright]
typeCheckingMode = "strict"
