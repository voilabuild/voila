syntax = "proto3";

package voila.v1;

// Zig voilad Worker wire messages (subset of internal/proto/worker.proto).

message RunSpec {
  string image = 1;
  repeated string args = 2;
  int64 memory_limit_bytes = 3;
  int32 cpu_quota_percent = 4;
  bool attach_stdin = 5;
}

message RunInput {
  oneof input {
    RunSpec spec = 1;
    bytes stdin = 2;
    bool stdin_eof = 3;
  }
}

message FetchStats {
  uint64 chunks_fetched = 1;
  uint64 bytes_fetched = 2;
  uint64 image_chunks = 3;
  uint64 image_bytes = 4;
}

message RunOutput {
  oneof output {
    string context_id = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    int32 exit_code = 4;
    FetchStats stats = 5;
  }
}

message ExecSpec {
  string context_id = 1;
  repeated string args = 2;
  bool attach_stdin = 3;
}

message ExecInput {
  oneof input {
    ExecSpec spec = 1;
    bytes stdin = 2;
    bool stdin_eof = 3;
  }
}

message ExecOutput {
  oneof output {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_SCHEDULED = 1;
  EVENT_TYPE_STARTED = 2;
  EVENT_TYPE_READY = 3;
  EVENT_TYPE_FINISHED = 4;
}

message Event {
  string context_id = 1;
  EventType type = 2;
  int64 timestamp_ns = 3;
  int32 exit_code = 4;
}

message EventsRequest {
  string context_id = 1;
}

message LogsRequest {
  string context_id = 1;
  bool follow = 2;
}

message LogChunk {
  bytes data = 1;
  bool stderr = 2;
  int64 timestamp_ns = 3;
}

message ListRequest {}

message ContextInfo {
  string id = 1;
  string image_ref = 2;
  string status = 3;
  int64 started_ns = 4;
  int32 pid = 5;
  int32 exit_code = 6;
  FetchStats stats = 7;
}

message ListResponse {
  repeated ContextInfo contexts = 1;
}

message KillRequest {
  string context_id = 1;
  int32 signal = 2;
}

message KillResponse {}

message SetRegistryRequest {
  string registry_url = 1;
  string token = 2;
}

message SetRegistryResponse {}

service Worker {
  rpc Run(stream RunInput) returns (stream RunOutput);
  rpc Exec(stream ExecInput) returns (stream ExecOutput);
  rpc Events(EventsRequest) returns (stream Event);
  rpc Logs(LogsRequest) returns (stream LogChunk);
  rpc List(ListRequest) returns (ListResponse);
  rpc Kill(KillRequest) returns (KillResponse);
  rpc SetRegistry(SetRegistryRequest) returns (SetRegistryResponse);
}
