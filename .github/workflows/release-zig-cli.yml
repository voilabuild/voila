# release-zig-cli.yml — static musl voila CLI on v* tags.

name: release-zig-cli

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-4vcpu-ubuntu-2404
            arch: amd64
            zig_target: x86_64-linux-musl
          - runner: blacksmith-4vcpu-ubuntu-2404-arm
            arch: arm64
            zig_target: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: ${{ matrix.zig_target }}

      - name: Build voila
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target }}

      - name: Require a fully static binary
        run: |
          set -euo pipefail
          file zig-out/bin/voila | grep -q 'statically linked'
          if readelf -d zig-out/bin/voila | grep -q NEEDED; then
            echo "voila still has dynamic library dependencies" >&2
            readelf -d zig-out/bin/voila >&2
            exit 1
          fi

      - name: Package release binaries
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('workflow-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          voila_asset="voila_${TAG}_linux_${{ matrix.arch }}"
          cp zig-out/bin/voila "$voila_asset"
          sha256sum "$voila_asset" > "checksums_${{ matrix.arch }}.txt"
          echo "VOILA_ASSET=$voila_asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: voila-${{ matrix.arch }}
          path: |
            voila_*_linux_${{ matrix.arch }}
            checksums_${{ matrix.arch }}.txt

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        run: |
          set -euo pipefail
          cat dist/checksums_*.txt > dist/voila-checksums.txt
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/voila_*_linux_amd64
            dist/voila_*_linux_arm64
            dist/voila-checksums.txt
          fail_on_unmatched_files: true
