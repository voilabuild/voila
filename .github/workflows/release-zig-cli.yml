# release-zig-cli.yml — static musl voila CLI (+ voila-import helper from go-final) on v* tags.

name: release-zig-cli

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            zig_target: x86_64-linux-musl
            zig_archive: zig-x86_64-linux-0.17.0
            goarch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            zig_target: aarch64-linux-musl
            zig_archive: zig-aarch64-linux-0.17.0
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig 0.17.0
        env:
          ZIG_VERSION: 0.17.0
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${{ matrix.zig_archive }}.tar.xz" \
            | tar -xJ
          echo "$PWD/${{ matrix.zig_archive }}" >> "$GITHUB_PATH"

      - name: Build voila
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig_target }}

      - name: Require a fully static binary
        run: |
          set -euo pipefail
          file zig-out/bin/voila | grep -q 'statically linked'
          if readelf -d zig-out/bin/voila | grep -q NEEDED; then
            echo "voila still has dynamic library dependencies" >&2
            readelf -d zig-out/bin/voila >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build voila-import from go-final
        run: |
          set -euo pipefail
          git fetch --depth 1 origin tag go-final
          work="$(mktemp -d)"
          git archive go-final | tar -x -C "$work"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go -C "$work" build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/voila-import" ./cmd/voila

      - name: Package release binaries
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('workflow-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          voila_asset="voila_${TAG}_linux_${{ matrix.arch }}"
          import_asset="voila-import_${TAG}_linux_${{ matrix.arch }}"
          cp zig-out/bin/voila "$voila_asset"
          cp voila-import "$import_asset"
          sha256sum "$voila_asset" "$import_asset" > "checksums_${{ matrix.arch }}.txt"
          echo "VOILA_ASSET=$voila_asset" >> "$GITHUB_ENV"
          echo "IMPORT_ASSET=$import_asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: voila-${{ matrix.arch }}
          path: |
            voila_*_linux_${{ matrix.arch }}
            voila-import_*_linux_${{ matrix.arch }}
            checksums_${{ matrix.arch }}.txt

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge checksums
        run: |
          set -euo pipefail
          cat dist/checksums_*.txt > dist/voila-checksums.txt
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/voila_*_linux_amd64
            dist/voila_*_linux_arm64
            dist/voila-import_*_linux_amd64
            dist/voila-import_*_linux_arm64
            dist/voila-checksums.txt
          fail_on_unmatched_files: true
