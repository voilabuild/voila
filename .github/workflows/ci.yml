# ci.yml — fast checks on every pull request (and pushes to main).

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: zig fmt --check
        run: zig fmt --check .

      - name: zig build test
        run: zig build test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: astral-sh/setup-uv@v6

      - name: Allow FUSE and unprivileged user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: zig build
        run: zig build -Doptimize=ReleaseSafe

      - name: pyright
        working-directory: test/e2e
        run: uv run pyright

      - name: pytest
        working-directory: test/e2e
        run: uv run pytest -v -rP

  lint-openapi:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@v1
      - name: Install vacuum (prebuilt binary)
        run: |
          VACUUM=v0.30.0
          curl -fsSL "https://github.com/daveshanley/vacuum/releases/download/${VACUUM}/vacuum_${VACUUM#v}_linux_x86_64.tar.gz" -o vacuum.tgz
          tar -xzf vacuum.tgz vacuum
      - name: Lint OpenAPI spec
        run: ./vacuum lint -d doc/registry/openapi.yaml
