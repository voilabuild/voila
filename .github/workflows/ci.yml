# ci.yml — fast checks on every pull request (and pushes to main).
# Privileged gate scripts (FUSE/runc/NBD) stay manual/devcontainer — see doc/TESTING.md.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zig:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        env:
          ZIG_VERSION: 0.17.0
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: zig fmt --check
        run: zig fmt --check .

      - name: zig build test
        run: zig build test

  lint-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install vacuum (prebuilt binary)
        run: |
          VACUUM=v0.30.0
          curl -fsSL "https://github.com/daveshanley/vacuum/releases/download/${VACUUM}/vacuum_${VACUUM#v}_linux_x86_64.tar.gz" -o vacuum.tgz
          tar -xzf vacuum.tgz vacuum
      - name: Lint OpenAPI spec
        run: ./vacuum lint -d doc/registry/openapi.yaml
